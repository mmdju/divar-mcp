name: Live verify

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# The hourly cadence never overlaps a finished run; this keeps a manual or
# slow run from racing the next hour's start.
concurrency:
  group: live-verify
  cancel-in-progress: false

jobs:
  # A red badge must mean "broken". Divar's edge intermittently challenges
  # the Actions region, and the challenge can outlast one cooldown, so a
  # failed run is retried twice - after a 5-minute and then a 15-minute
  # pause - before the badge is allowed to go red.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-live.mjs

  retry:
    runs-on: ubuntu-latest
    needs: verify
    if: failure()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sleep 300 && node scripts/verify-live.mjs

  retry-late:
    runs-on: ubuntu-latest
    needs: retry
    if: failure()
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sleep 900 && node scripts/verify-live.mjs
